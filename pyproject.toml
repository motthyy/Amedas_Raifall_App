[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amedas-rainfall"
version = "0.1.0"
description = "アメダス長期雨量・鉄道防災指標解析アプリ"
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "streamlit>=1.50,<2",
    "plotly>=6.1,<7",
    "kaleido>=1.0,<2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<2.3",
    "numba>=0.61,<1",
    "scipy>=1.13,<2",
    "pyarrow>=16.0",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "requests>=2.32",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "playwright>=1.46",
    "PyYAML>=6.0",
    "tenacity>=8.5",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.9"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
